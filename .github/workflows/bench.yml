name: Bench

# 基准回归报告：PR 上对比 base 与 head（benchstat），push main 只记录当前数字。
# 只报告不拦截——GitHub runner 噪声大，看趋势用。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Bench head
        run: go test -run xxx -bench . -benchmem -count=6 ./ | tee /tmp/new.txt

      - name: Bench base (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          (cd /tmp/base && go test -run xxx -bench . -benchmem -count=6 ./ | tee /tmp/old.txt)

      - name: Report
        run: |
          echo '## Benchmarks' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/old.txt ]; then
            benchstat /tmp/old.txt /tmp/new.txt >> $GITHUB_STEP_SUMMARY
          else
            benchstat /tmp/new.txt >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
